schema: spec-driven

# プロジェクトコンテキスト: アーティファクト作成時に AI へ提示される情報。
# 技術スタック・規約・スタイルガイド・ドメイン知識などを記述する。
context: |
  言語: すべてのアーティファクト（proposal / design / specs / tasks など）は
  日本語で記述すること。思考は英語で行ってよいが、ファイルに書き出す
  Markdown 本文は必ず日本語にする。
  ただし以下は原語（英語）のまま保持する:
    - 見出しキーワード（ADDED / MODIFIED / REMOVED / Requirement / Scenario など）
    - コード・識別子・ファイルパス・コマンド・ライブラリ名
    - Gherkin のキーワード（WHEN / THEN / GIVEN など）
  これらのキーワードは OpenSpec のパーサが読み取る構造マーカーであり、
  日本語化すると仕様が認識されなくなるため必ず英語のまま残す。
  読みやすさは、キーワードに続く見出しタイトルと本文を日本語で書くことで確保する。
  例:
    ## ADDED Requirements
    ### Requirement: 作業時間の記録（イベント駆動）
    #### Scenario: 記録が保存される
    - **WHEN** ユーザーが「10分」を選択したとき
    - **THEN** その日の合計に10分が反映されること
  技術用語は無理に訳さず、一般的なカタカナ表記または英語をそのまま使う。

# アーティファクト別ルール: proposal / design / specs / tasks それぞれに適用する記述ルール。
rules:
  proposal:
    - 日本語で記述する
  design:
    - 日本語で記述する
  specs:
    - 要件・シナリオの本文は日本語で記述する
    - ADDED / MODIFIED / REMOVED / Requirement / Scenario などの構造キーワードは英語のまま残す
      （パーサが読み取るマーカーのため、日本語化すると仕様が認識されない）
    - "キーワードに続く見出しタイトルは日本語で書く（例: `### Requirement: 作業時間の記録（イベント駆動）`）"
    - 見出しタイトルには、その要件が該当する EARS の型を括弧書きで添える
    - 要件は EARS 記法（Easy Approach to Requirements Syntax）の日本語形で記述する
    - EARS の型は以下から選ぶこと（テンプレートの「システム」は実際の主体名に置き換える）
    - "「ユビキタス（常時）: システムは <応答> すること」"
    - "「イベント駆動: <トリガー> したとき、システムは <応答> すること」"
    - "「状態駆動: <状態> である間、システムは <応答> すること」"
    - "「オプション: <機能> が有効な場合、システムは <応答> すること」"
    - "「望ましくない事象: <条件> の場合、システムは <応答> すること」"
    - "「複合: 上記の型を組み合わせ、条件を明示して記述する」"
    - 1 要件につき 1 つの検証可能な振る舞いのみを書く（「かつ」で複数の振る舞いを詰め込まない）
    - 「適切に」「高速に」「使いやすく」などの曖昧語を避け、数値・閾値・具体的な状態で書く
    - 主体を必ず明示し、受動態ではなく能動態で書く
    - シナリオは Gherkin キーワード（WHEN / THEN / GIVEN / AND）を英語のまま残し、続く本文を日本語で書く
    - シナリオは観測可能な入力と出力で書き、内部実装の手順を書かない
  tasks:
    - タスクの説明は日本語で記述する

# 操作別ガイダンス: apply と archive の進め方についての助言。
# 上記のアーティファクト別ルールとは別枠の設定。
operations:
  apply:
    guidance:
      - 進捗報告・テスト結果の要約は日本語で行う
  archive:
    guidance:
      - アーカイブ結果の要約は日本語で行う
