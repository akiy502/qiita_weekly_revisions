# 版一覧の取得と GitHub Pages への公開。
# GITHUB_TOKEN による push は別のワークフローを起動しないため、
# 取得 → commit → 公開を 1 本のワークフローで行う。
name: update

on:
  schedule:
    # UTC の水・土 21:00 = JST の木・日 06:00（版は JST 05:12 ごろに作られる）
    - cron: "0 21 * * 3,6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch revisions
        run: node scripts/fetch-revisions.mjs

      - name: Commit if changed
        id: commit
        run: |
          git add site/revisions.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update revisions"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: fetch
    # push のときは fetch がスキップされる。取得したときは差分があった場合だけ公開する
    if: >-
      always() && (
        (github.event_name == 'push' && needs.fetch.result == 'skipped') ||
        (needs.fetch.result == 'success' && needs.fetch.outputs.changed == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch ジョブが追加した commit を含めるため、main の最新を取る
          ref: main

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
